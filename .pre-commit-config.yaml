# Проверки, которые запускаются автоматически при каждом git commit
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (ошибки и стиль)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (оформление)
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pytest
        name: pytest (тесты)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
